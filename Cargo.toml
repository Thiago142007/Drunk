[package]
name = "drunk"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "drunk"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png"] }
hibernia = "=0.1.0"
minifb = "0.29"
crossbeam-channel = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
